name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Exercises ship as TODOs, so CI only checks that everything (including tests) compiles.
      - name: Compile exercises and tests
        run: ./mvnw -B -q -DskipTests test-compile
